spring:
  application:
    name: abac-authz
  datasource:
    url: jdbc:h2:file:./data/abac;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8080

# 前端开发时允许跨域（与 Vue dev 联调），多端口以防 Vite 换端口
cors:
  allowed-origins: http://localhost:5176
