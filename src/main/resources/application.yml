spring:
  application:
    name: abac-mvp
  datasource:
    url: jdbc:h2:mem:abac;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER_CASE=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8080
